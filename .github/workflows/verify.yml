name: Verificación

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Ejecutar pruebas
        run: npm test

      - name: Conciliar datos demo
        run: npm run verify:data

      - name: Construir imagen local sin publicar
        run: docker build --tag casa-morra:ci .

      - name: Comprobar compresión y rutas en el contenedor
        run: |
          docker run --detach --name casa-morra-gzip-ci --read-only --tmpfs /tmp:rw,nosuid,noexec,size=16m --cap-drop ALL --security-opt no-new-privileges --publish 127.0.0.1:18089:8080 casa-morra:ci >/dev/null
          trap 'docker rm -f casa-morra-gzip-ci >/dev/null 2>&1 || true' EXIT
          for intento in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18089/health >/dev/null; then break; fi
            sleep 1
          done
          CASA_MORRA_TEST_URL=http://127.0.0.1:18089 node --test test/gzip-runtime.test.mjs
