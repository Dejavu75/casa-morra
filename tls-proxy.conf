server {
    listen 8443 ssl;
    server_name ingenieros.deyzone.com.ar;

    ssl_certificate /etc/letsencrypt/live/ingenieros.deyzone.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ingenieros.deyzone.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # La web HTTP existente sigue activa; HSTS afectaría también al puerto 8088.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $casa_morra_web web:8088;

    location / {
        proxy_pass http://$casa_morra_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
