server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Este servicio de bucle local usa HTTP, sin HSTS ni redirección HTTPS.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'" always;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Los recursos inexistentes nunca reciben el documento HTML de la SPA.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
