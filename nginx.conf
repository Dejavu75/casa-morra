server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Comprimir documentos y módulos textuales; las imágenes ya están codificadas.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json application/xml text/xml image/svg+xml;

    # Este servicio de bucle local usa HTTP, sin HSTS ni redirección HTTPS.
    include /etc/nginx/security-headers.inc;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Única lectura HTTP de la exportación ficticia; nunca se monta el almacén privado.
    location = /demo/snapshot.json {
        alias /srv/casa-morra-public/snapshot.json;
        default_type application/json;
        add_header Cache-Control no-store always;
        # add_header local corta la herencia: reponer todos los encabezados de seguridad.
        include /etc/nginx/security-headers.inc;
    }

    location ^~ /demo/ {
        return 404;
    }

    # Los recursos inexistentes nunca reciben el documento HTML de la SPA.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Los módulos importados y sus estilos no son rutas de navegación.
    location ~ ^/(?:views|data|domain|i18n)/ {
        try_files $uri =404;
    }

    # También protege recursos directos como /router.js o /favicon.ico.
    location ~* \.(?:js|css|png|jpe?g|svg|webp|ico|woff2?|json|map|txt|webmanifest)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
